<style>
/* ============================================================
   Tinta azul sobre papel. La idea de libro de cuentas la sostienen
   el papel y los renglones reglados, no el color; el azul es el de
   la tinta y el rojo queda reservado para el sobregiro.
   Tema unico y claro, por decision: sin variantes oscuras.
   ============================================================ */
:root{
  /* Tinta azul, un solo tema claro. color-scheme:light es obligatorio:
     sin el, un telefono en modo oscuro pinta los controles nativos
     (date, select) en oscuro sobre este papel. */
  --paper:#F8FAFD; --card:#FFFFFF; --banda:#F3F7FC; --hundido:#EDF2F8;
  --rule:#DCE5F0;  --ink:#141C28;  --ink2:#54627A; --ink3:#64748B;
  --accent:#2E5E9E; --over:#B33A2B; --warn:#8A6412;
  --on-accent:#FFFFFF;
  /* Rampa secuencial de la dona: un solo tono, luminosidad creciente
     (verificada monotona). El rango va recortado a proposito: estirarla
     hasta el azul palido deja el paso mas claro en 1.35 de contraste
     sobre tarjeta blanca, practicamente invisible. */
  --d1:#1F4C89; --d2:#2F6299; --d3:#4177AC; --d4:#548CBE; --d5:#69A1CF; --d6:#83B7DF;
  --sombra:0 1px 0 var(--rule), 0 10px 30px -22px rgba(20,28,40,.45);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font:400 15px/1.55 Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  -webkit-text-size-adjust:100%;
}
.hoja-libro{
  max-width:720px; margin:0 auto; padding:0 18px;
  padding-block:22px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
}
section{margin-top:30px}

/* ---- cifras: la L se subordina al número ---- */
.cifra{font:500 15px/1 "JetBrains Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; white-space:nowrap}
.cifra i{font-style:normal; font-weight:400; font-size:.78em; color:var(--ink3); margin-right:.28em}
.cifra.rojo{color:var(--over)}
.cifra.gr{font-size:30px; font-weight:700; letter-spacing:-.02em}

/* ---- cabecera ---- */
.cabecera{display:flex; align-items:flex-start; justify-content:space-between; gap:14px}
.cabecera h1{margin:0; font-size:23px; font-weight:700; letter-spacing:-.025em}
.folio{
  margin:5px 0 0; color:var(--ink2);
  font:400 12px/1.4 "JetBrains Mono", monospace; font-variant-numeric:tabular-nums;
}
.folio i{font-style:normal; color:var(--ink3); margin:0 2px}

/* ---- la regla: el renglón del libro como divisor de sección ---- */
.regla{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.regla h2{
  margin:0; font-size:11px; font-weight:600; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink2); white-space:nowrap;
}
.regla-linea{flex:1; height:1px; background:var(--rule)}
.regla-dato{font:400 11px/1 "JetBrains Mono", monospace; color:var(--ink3); white-space:nowrap}
.regla-dato .cifra{font-size:11px}

/* ---- FIRMA: el medidor de ritmo ---- */
.ritmo{
  margin-top:22px; padding:18px; border-radius:3px;
  background:var(--card); border:1px solid var(--rule); box-shadow:var(--sombra);
  border-left:3px solid var(--accent);
}
.ritmo.sobre{border-left-color:var(--over)}
.ritmo.holgado{border-left-color:var(--accent)}
.ritmo-cab{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.ritmo-estado{font-size:19px; font-weight:600; letter-spacing:-.015em}
.ritmo.sobre .ritmo-estado{color:var(--over)}
.ritmo-dias{font:400 12px "JetBrains Mono", monospace; color:var(--ink3)}

.escala{margin-top:16px}
.escala-pista{position:relative; height:12px; background:var(--hundido); border-radius:2px}
.escala-gasto{
  position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:2px;
  transition:width .7s cubic-bezier(.22,.8,.3,1);
}
.ritmo.sobre .escala-gasto{background:var(--over)}
.escala-ciclo{position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--ink); border-radius:2px}
.escala-ciclo span{
  position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  font:500 9px "JetBrains Mono", monospace; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink2);
}
.escala-pie{
  display:flex; justify-content:space-between; margin-top:9px;
  font:400 11px "JetBrains Mono", monospace; color:var(--ink3);
}

.ritmo-datos{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0 0; padding-top:15px; border-top:1px solid var(--rule)}
.ritmo-datos div{min-width:0}
.ritmo-datos dt{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3)}
.ritmo-datos dd{margin:5px 0 0}
@media (max-width:430px){
  .ritmo-datos{grid-template-columns:1fr 1fr}
  .ritmo-datos div:last-child{grid-column:1/-1; padding-top:10px; border-top:1px solid var(--rule)}
}

/* ---- sobres de presupuesto ---- */
.sobres{list-style:none; margin:0; padding:0}
.sobre{border-bottom:1px solid var(--rule)}
.sobre:last-child{border-bottom:0}
.sobre-btn{
  display:block; width:100%; padding:14px 2px; border:0; background:none;
  font:inherit; color:inherit; text-align:left; cursor:pointer;
}
.sobre-btn:hover{background:var(--banda)}
.sobre-btn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.sobre-cab{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.sobre-nombre{display:flex; align-items:center; gap:9px; font-weight:500; min-width:0}
.punto{width:7px; height:7px; border-radius:50%; background:var(--c); flex:none}
/* line-height:1 evita que el emoji estire la fila; width fija alinea las
   columnas aunque los emoji midan distinto. */
.marca{font-style:normal; font-size:15px; line-height:1; width:20px; flex:none; text-align:center}
.leyenda .marca{font-size:16px}
.sobre-restante{font-size:12px; color:var(--ink2); white-space:nowrap}
.barra{position:relative; height:8px; margin-top:10px; background:var(--hundido); border-radius:2px}
.barra-relleno{
  position:absolute; inset:0 auto 0 0; background:var(--c); border-radius:2px;
  transition:width .7s cubic-bezier(.22,.8,.3,1);
}
.barra-relleno.meta{background:var(--accent)}
.sobre.excedido .barra-relleno{background:var(--over)}
.barra-ritmo{position:absolute; top:-3px; bottom:-3px; width:1.5px; background:var(--ink2); opacity:.55}
.sobre-pie{
  display:flex; justify-content:space-between; margin-top:7px;
  font:400 11px "JetBrains Mono", monospace; font-variant-numeric:tabular-nums; color:var(--ink3);
}
.sobre.excedido .sobre-pct{color:var(--over)}
/* Las metas usan .sobre sin botón dentro: llevan su propio relleno. */
.sobre.estatico{padding:14px 0}

/* ---- vistas: libro / gráficos ---- */
.vistas{display:flex; margin-top:18px; border-bottom:1px solid var(--rule)}
.vistas button{
  flex:1; padding:10px 4px; border:0; border-bottom:2px solid transparent;
  background:none; color:var(--ink3); cursor:pointer;
  font:600 13px Archivo, sans-serif; letter-spacing:.04em;
}
.vistas button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

/* ---- rejilla de gráficos ---- */
.graficos{display:grid; gap:14px; margin-top:20px}
@media (min-width:620px){ .graficos{grid-template-columns:1fr 1fr} }
.grafico{
  margin:0; padding:16px; border:1px solid var(--rule); border-radius:3px;
  background:var(--card); box-shadow:var(--sombra);
}
.grafico figcaption{display:flex; flex-direction:column; gap:3px}
.grafico figcaption b{font-size:14px; font-weight:600; letter-spacing:-.01em}
.grafico figcaption span{font:400 11px "JetBrains Mono", monospace; color:var(--ink3)}
.grafico .dona{margin:8px auto 0; max-width:208px}
.grafico .vacio{padding:34px 0; text-align:center; font-size:13px}

/* ---- desglose por rango ---- */
.desglose{transition:opacity .2s}
.desglose.cargando{opacity:.45}
.rangos{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.rangos button{
  padding:6px 12px; border:1px solid var(--rule); border-radius:3px; background:none;
  color:var(--ink2); font:500 12.5px Archivo, sans-serif; cursor:pointer;
}
.rangos button.sel{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.rango-fechas{display:flex; gap:10px}
.rango-fechas label{flex:1; min-width:0}
.rango-fechas span{display:block; margin-bottom:5px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3)}
.rango-fechas input{
  width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:3px;
  background:var(--card); color:var(--ink); font:400 13px "JetBrains Mono", monospace;
}
.rango-resumen{margin:18px 0 0; display:flex; flex-direction:column; gap:5px}
.rango-resumen span{font-size:12.5px; color:var(--ink3); line-height:1.5}

/* ---- dona: rampa secuencial, magnitud de oscuro a claro ---- */
.dona{margin:16px auto 4px; max-width:260px}
.dona svg{display:block; width:100%; height:auto}
/* 18px y sin decimales: el hueco interior mide 110 unidades del viewBox
   y la cifra completa a 21px se sale por los costados. */
.dona-cifra{
  font:700 18px "JetBrains Mono", monospace; font-variant-numeric:tabular-nums;
  fill:var(--ink);
}
.dona-pie{font:400 10px Archivo, sans-serif; letter-spacing:.12em; text-transform:uppercase; fill:var(--ink3)}

.leyenda{list-style:none; margin:14px 0 0; padding:0; border-top:1px solid var(--rule)}
.leyenda li{border-bottom:1px solid var(--rule)}
.leyenda li.cero{opacity:.55}
/* Colocación explícita en las dos filas: si se deja al flujo automático,
   el porcentaje se va a una fila suelta. */
.leyenda button{
  display:grid; grid-template-columns:auto 1fr auto; gap:1px 10px; align-items:center;
  width:100%; padding:10px 2px; border:0; background:none; color:inherit;
  font:inherit; text-align:left; cursor:pointer;
}
.leyenda button:hover{background:var(--banda)}
.leyenda button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.leyenda .punto{grid-column:1; grid-row:1}
.leyenda-nombre{grid-column:2; grid-row:1; font-weight:500}
.leyenda-monto{grid-column:3; grid-row:1; font-size:14px; font-weight:500; white-space:nowrap; text-align:right}
.leyenda-lim{grid-column:2; grid-row:2; font-size:11px; color:var(--ink3)}
.leyenda-pct{grid-column:3; grid-row:2; font-size:11px; color:var(--ink3); text-align:right}
.exceso{margin-left:6px; color:var(--over); font-weight:600}
.alerta code{font-family:"JetBrains Mono",monospace; font-size:12px; background:var(--hundido); padding:1px 5px; border-radius:3px}

/* ---- categorías sin límite ---- */
.sin-limite{margin-top:16px; padding-top:14px; border-top:1px dashed var(--rule)}
.sin-limite p{margin:0 0 10px; font-size:12.5px; color:var(--ink3)}
.sin-limite ul{display:flex; flex-wrap:wrap; gap:7px; list-style:none; margin:0; padding:0}
.sin-limite button{
  display:inline-flex; align-items:center; gap:7px;
  padding:6px 11px; border:1px dashed var(--rule); border-radius:3px;
  background:none; color:var(--ink2); font:500 13px Archivo, sans-serif; cursor:pointer;
}
.sin-limite button:hover{border-style:solid; border-color:var(--accent); color:var(--ink)}
.sin-limite button i{font-style:normal; color:var(--ink3); font-size:15px; line-height:1}
.sin-limite button:hover i{color:var(--accent)}

.hoja-nota{margin:-6px 0 16px; font-size:13px; color:var(--ink2)}

/* ---- cinta del mes ---- */
.cinta-barras{display:flex; align-items:flex-end; gap:2px; height:82px; padding:0 1px}
.dia{flex:1; height:100%; display:flex; align-items:flex-end; border-radius:1px}
.dia-barra{width:100%; background:var(--ink3); opacity:.42; border-radius:1px; transition:height .5s ease}
.dia.con .dia-barra{background:var(--accent); opacity:.85}
.dia.hoy .dia-barra{background:var(--ink); opacity:1}
.dia.hoy{box-shadow:inset 0 -1px 0 var(--ink)}
.cinta-pie{
  display:flex; justify-content:space-between; gap:10px; margin-top:9px; padding-top:8px;
  border-top:1px solid var(--rule);
  font:400 11px "JetBrains Mono", monospace; color:var(--ink3);
}
.cinta-prom{text-align:center}

/* ---- cuentas ---- */
.cuentas{list-style:none; margin:0; padding:0}
.cuentas li{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--rule)}
.cuentas li:last-child{border-bottom:0}
.cuentas b{font-weight:500}
.cuentas small{display:block; font-size:11px; color:var(--ink3); text-transform:capitalize}

/* ---- asientos: el renglón reglado, con banda alterna ---- */
.asientos{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
.asientos li:nth-child(odd){background:var(--banda)}
.asiento{
  display:grid; grid-template-columns:38px 1fr auto; gap:13px; align-items:center;
  width:100%; padding:11px 10px; border:0; border-bottom:1px solid var(--rule);
  background:none; color:inherit; font:inherit; text-align:left; cursor:pointer;
}
.asiento:hover{background:var(--hundido)}
.asiento:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.asiento-fecha{
  text-align:center; color:var(--ink3);
  font:400 10px/1.2 "JetBrains Mono", monospace; text-transform:uppercase;
}
.asiento-fecha b{display:block; font-size:15px; font-weight:500; color:var(--ink2)}
.asiento-glosa{min-width:0}
.asiento-glosa b{font-weight:500}
.asiento-glosa small{display:block; margin-top:1px; font-size:11.5px; color:var(--ink3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.asiento-monto{
  font:500 14px "JetBrains Mono", monospace; font-variant-numeric:tabular-nums; white-space:nowrap;
}
.asiento-monto.ingreso{color:var(--accent)}
.asiento-monto.transferencia{color:var(--ink3)}

/* ---- formularios ---- */
.campos{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:13px}
.campo{display:block; min-width:0}
.campo.ancho{grid-column:1/-1}
.campo>span{display:block; margin-bottom:6px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3)}
.campo input,.campo select{
  width:100%; padding:10px 11px; border:1px solid var(--rule); border-radius:3px;
  background:var(--card); color:var(--ink); font:400 15px Archivo, sans-serif;
}
.monto-caja{display:flex; align-items:stretch; border:1px solid var(--rule); border-radius:3px; background:var(--card); overflow:hidden}
.monto-caja i{
  display:flex; align-items:center; padding:0 11px; background:var(--hundido); color:var(--ink3);
  font:400 13px "JetBrains Mono", monospace; font-style:normal; border-right:1px solid var(--rule);
}
.monto-caja input{border:0; border-radius:0; font:500 19px "JetBrains Mono", monospace; font-variant-numeric:tabular-nums}
.campo input:focus,.campo select:focus,.monto-caja input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.monto-caja:focus-within{outline:2px solid var(--accent); outline-offset:1px}

.pestanas{display:flex; gap:0; margin-bottom:16px; border-bottom:1px solid var(--rule)}
.pestanas button{
  flex:1; padding:9px 4px; border:0; border-bottom:2px solid transparent; background:none;
  color:var(--ink3); font:500 13px Archivo, sans-serif; cursor:pointer;
}
.pestanas button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

.btn{
  padding:10px 17px; border:1px solid var(--rule); border-radius:3px; background:var(--card);
  color:var(--ink2); font:500 14px Archivo, sans-serif; cursor:pointer;
}
.btn:hover{border-color:var(--ink3)}
.btn.primario{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.peligro{color:var(--over); border-color:var(--over); background:none}
.btn.sutil{width:100%; margin-top:11px; background:none; border-style:dashed}
.btn.icono{padding:8px 12px; font-size:16px; line-height:1}
.btn:disabled{opacity:.55; cursor:default}
.captura .btn.primario{width:100%; margin-top:16px; padding:13px}

/* ---- avisos, vacíos, esqueleto ---- */
.alerta{
  margin-top:18px; padding:12px 14px; border:1px solid var(--rule); border-left:3px solid var(--warn);
  border-radius:3px; background:var(--card); font-size:13.5px; color:var(--ink2);
}
.alerta b{color:var(--ink)}
.vacio{margin:0; padding:20px 0; color:var(--ink3); font-size:14px}
.esqueleto{margin-top:26px; display:grid; gap:11px}
.esq-fila{height:58px; border-radius:3px; background:var(--hundido); animation:latir 1.5s ease-in-out infinite}
.esq-fila:nth-child(1){height:128px}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.5}}

.aviso{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 82px);
  max-width:calc(100% - 32px); padding:11px 18px; border-radius:3px;
  background:var(--ink); color:var(--paper); font-size:14px; z-index:60;
  box-shadow:0 8px 26px -12px rgba(0,0,0,.6);
}

/* ---- acción fija ---- */
.fab{
  position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding:14px 24px; border:0; border-radius:3px; z-index:50;
  background:var(--accent); color:var(--on-accent);
  font:600 15px Archivo, sans-serif; cursor:pointer;
  box-shadow:0 10px 26px -10px rgba(0,0,0,.45);
  transition:opacity .25s ease, transform .25s ease;
}
.fab.oculto{opacity:0; transform:translateY(14px); pointer-events:none}

/* ---- hoja de corrección ---- */
.hoja{
  border:1px solid var(--rule); border-radius:4px; background:var(--card); color:var(--ink);
  padding:22px; max-width:440px; width:calc(100% - 30px); box-shadow:var(--sombra);
}
.hoja::backdrop{background:rgba(8,16,12,.55)}
.hoja h2{margin:0 0 16px; font-size:18px; font-weight:600; letter-spacing:-.015em}
.hoja-pie{display:flex; gap:9px; margin-top:18px; flex-wrap:wrap}
.hoja-pie .btn.peligro{margin-left:auto}

/* ---- alta ---- */
.alta{max-width:460px; margin:0 auto; padding:56px 20px}
.alta h1{margin:0 0 12px; font-size:27px; font-weight:700; letter-spacing:-.025em}
.alta p{margin:0 0 24px; color:var(--ink2); font-size:14.5px}
.alta .campo{margin-bottom:15px}
.alta .btn{width:100%; padding:13px}

.conexion{margin-top:36px; padding-top:16px; border-top:1px solid var(--rule); font-size:13px; color:var(--ink2)}
.conexion summary{cursor:pointer; color:var(--ink3); font-size:11px; letter-spacing:.1em; text-transform:uppercase}
.conexion p{margin:12px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
